name: CI

on:
  pull_request:
    branches:
      - develop
      - "dev-v*"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/yoshinani-form-schema
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/yoshinani-form-schema/package-lock.json

      - name: Install
        run: npm ci

      - name: Test with coverage
        run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/yoshinani-form-schema/coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack check
        run: npm run pack:check
