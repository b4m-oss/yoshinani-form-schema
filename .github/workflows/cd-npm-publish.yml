name: CD npm publish

# B-pattern:
# - Tags are created on commits already on main (not on release). Tag push does NOT publish.
# - Publish runs when `release` is updated (typically after merging main into release).
# - Gates: package.json version is exact X.Y.Z, matching tag vX.Y.Z exists on an ancestor of HEAD.
# Auth: repository secret NPM_TOKEN (same as other @b4moss repos).
# Package lives under packages/yoshinani-form-schema.

on:
  push:
    branches:
      - release

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/yoshinani-form-schema
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and verify tag gate
        id: gate
        working-directory: .
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./packages/yoshinani-form-schema/package.json').version")"
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ ! "${PKG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping publish: package.json version '${PKG_VERSION}' is not exact X.Y.Z (suffix versions are ignored)."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v${PKG_VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            # Tags may not be present on a shallow/default fetch of the branch tip alone.
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} not found. Tag the main commit before merging into release."
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" HEAD; then
            echo "::error::Tag ${TAG} (${TAG_COMMIT}) is not contained in release HEAD (${GITHUB_SHA}). Refusing to publish."
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG} (${TAG_COMMIT}) is on release; publishing ${PKG_VERSION}."

      - name: Setup Node.js
        if: steps.gate.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/yoshinani-form-schema/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install
        if: steps.gate.outputs.should_publish == 'true'
        run: npm ci

      - name: Skip if version already on npm
        if: steps.gate.outputs.should_publish == 'true'
        id: npm
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="${{ steps.gate.outputs.version }}"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skip publish: ${NAME}@${VERSION} already on npm"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test / typecheck / build
        if: steps.gate.outputs.should_publish == 'true' && steps.npm.outputs.already_published != 'true'
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Publish to npm
        if: steps.gate.outputs.should_publish == 'true' && steps.npm.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN secret is not set. Add it under Settings → Secrets → Actions (same as hyogen-md / jp-local-gov-id)."
            exit 1
          fi
          npm publish --access public --provenance
