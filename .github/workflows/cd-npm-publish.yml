name: CD npm publish

# B-pattern:
# - Tags are created on commits already on main (not on release).
# - Publish runs on tag push only when that commit is contained in `release`.
# - Exact tags only: vX.Y.Z (no -rc / +build suffixes).
# Auth:
# - Prefer npm Trusted Publishing (OIDC, id-token: write).
# - Optional fallback: repository secret NPM_TOKEN.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate tag name
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping publish: tag '${TAG}' is not an exact vX.Y.Z (suffix tags are ignored)."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.tag.outputs.should_publish == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit is on release
        if: steps.tag.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          git fetch origin release:refs/remotes/origin/release
          TAG_COMMIT="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/release; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${TAG_COMMIT}) is not contained in origin/release. Refusing to publish (B-pattern gate)."
            exit 1
          fi
          echo "Tag commit ${TAG_COMMIT} is on release."

      - name: Setup Node.js
        if: steps.tag.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Ensure modern npm for Trusted Publishing
        if: steps.tag.outputs.should_publish == 'true'
        run: npm install -g npm@11

      - name: Install
        if: steps.tag.outputs.should_publish == 'true'
        run: npm ci

      - name: Verify package.json version matches tag
        if: steps.tag.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [[ "${PKG_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::package.json version (${PKG_VERSION}) != tag version (${TAG_VERSION})"
            exit 1
          fi

      - name: Test / typecheck / build
        if: steps.tag.outputs.should_publish == 'true'
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Detect auth mode
        if: steps.tag.outputs.should_publish == 'true'
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Using NPM_TOKEN secret fallback."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "Using Trusted Publishing (OIDC). Ensure npmjs.com Trusted Publisher is configured for this workflow."
          fi

      - name: Publish with Trusted Publishing (OIDC)
        if: steps.tag.outputs.should_publish == 'true' && steps.auth.outputs.mode == 'oidc'
        run: |
          # Do not set NODE_AUTH_TOKEN; empty token in .npmrc can break OIDC.
          # setup-node may write an auth line; remove token so npm uses OIDC.
          if [[ -f "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" ]]; then
            sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" || true
          fi
          if [[ -f .npmrc ]]; then
            sed -i '/_authToken/d' .npmrc || true
          fi
          npm publish --access public --provenance

      - name: Publish with NPM_TOKEN fallback
        if: steps.tag.outputs.should_publish == 'true' && steps.auth.outputs.mode == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
